packages:
  - 'packages/*'
  - 'apps/*'
allowBuilds:
  nx: true
  unrs-resolver: true
  '@nestjs/core': false
  '@parcel/watcher': true
  less: false
  esbuild: true
  # swc native binding — nx/@swc-node need it; unapproved build scripts are
  # fatal (ERR_PNPM_IGNORED_BUILDS) on fresh CI installs (Render/Netlify)
  '@swc/core': true
  # testcontainers/tooling transitive deps — builds not needed (pure-JS fallbacks)
  cpu-features: false
  protobufjs: false
  ssh2: false
  '@bundled-es-modules/glob': false
  style-dictionary: false
  # MUI transitive telemetry — never run its install script
  '@scarf/scarf': false
  # msw postinstall only provisions the browser worker asset (tests use the node server)
  msw: false
