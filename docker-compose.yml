services:
  postgres:
    image: postgres:16-alpine
    container_name: tatame-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tatame}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tatame_dev}
      POSTGRES_DB: ${POSTGRES_DB:-tatame}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tatame} -d ${POSTGRES_DB:-tatame}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
