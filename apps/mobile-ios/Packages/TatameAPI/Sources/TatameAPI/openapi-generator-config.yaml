# swift-openapi-generator build-plugin config (ticket 02).
# Generated Swift lands in the build directory — never in git; the committed
# artifact is the sibling openapi.json copy (scripts/sync-openapi.sh).
generate:
  - types
  - client
# Slice filtering: only the tags this app consumes today. Persona tags join
# here when their feature slices land; admin/platform stay excluded
# (web-console-only personas on mobile). professor/responsavel landed with
# the enrollment slice (spec 003, ENR.24-26); aluno with the attendance
# slice (spec 004, ATT.22-24).
filter:
  tags:
    - auth
    - public
    - professor
    - responsavel
    - aluno
