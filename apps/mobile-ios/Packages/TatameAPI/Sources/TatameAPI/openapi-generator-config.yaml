# swift-openapi-generator build-plugin config (ticket 02).
# Generated Swift lands in the build directory — never in git; the committed
# artifact is the sibling openapi.json copy (scripts/sync-openapi.sh).
generate:
  - types
  - client
# Slice filtering: only the tags this app consumes today. Persona tags join
# here when their feature slices land; admin/platform stay excluded
# (web-console-only personas on mobile). professor/responsavel landed with
# the enrollment slice (spec 003, ENR.24-26); aluno with the attendance
# slice (spec 004, ATT.22-24); billing (shared simulate/receipt routes) with
# the billing slice (spec 006, BIL.22-24); store (shared aluno+professor
# storefront routes) with the store slice (spec 009, STO.14-15);
# notifications (persona-neutral feed/badge/settings routes) with the
# notifications slice (spec 010, NOT.12-13); rankings (shared aluno+professor
# ranking read) with the reports slice (spec 013, REP.16-18).
filter:
  tags:
    - auth
    - public
    - professor
    - responsavel
    - aluno
    - billing
    - store
    - notifications
    - rankings
